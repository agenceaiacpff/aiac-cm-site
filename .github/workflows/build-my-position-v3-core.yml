name: Build My Position V3 core

on:
  push:
    paths:
      - '.github/workflows/build-my-position-v3-core.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and patch V3 core
        run: |
          cp components/MyPositionWorkspaceV2.tsx components/MyPositionWorkspaceV3.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('components/MyPositionWorkspaceV3.tsx')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'anchor missing: {label}')
              s=s.replace(old,new,1)

          rep('type Person={profile_id:string;assignment_id:string;name:string;email:string|null;phone:string|null;title:string;slot_code:string};',
              'type Person={profile_id:string;assignment_id:string;name:string;email:string|null;phone:string|null;title:string;slot_code:string;relation_type?:string;body_code?:string};', 'Person')
          rep('type Workspace={profile:{id:string;full_name:string|null;email:string|null;phone:string|null;role:string};assignments:Assignment[];capabilities:string[];supervisors:Person[];subordinates:Person[];resources:Resource[];linked_projects:Project[]};',
              'type CapabilityDetail={key:string;label:string;description:string;risk_level:string};\ntype Workspace={profile:{id:string;full_name:string|null;email:string|null;phone:string|null;role:string};assignments:Assignment[];capabilities:string[];capability_details?:CapabilityDetail[];supervisors:Person[];subordinates:Person[];resources:Resource[];linked_projects:Project[]};', 'Workspace')
          rep('type DirectoryPerson={profile_id:string;full_name:string|null;email:string|null;phone:string|null;active_positions:string[]};',
              'type DirectoryPerson={profile_id:string;full_name:string|null;email:string|null;phone:string|null;active_positions:string[]};\ntype AssignmentAdmin={assignment_id:string;slot_id:string|null;slot_code:string|null;position_code:string;title:string;body_id:string;body_code:string;body_name:string;profile_id:string|null;full_name:string|null;email:string|null;phone:string|null;decision_reference:string;territory:string|null;start_date:string;end_date:string|null;assignment_status:string;supervisor_assignment_id:string|null;appointed_by:string;appointed_by_name:string|null};\ntype CorrespondencePerson={profile_id:string;full_name:string|null;email:string|null;phone:string|null;position_titles:string[]};', 'DirectoryPerson')
          rep('type Gender={id:string;reference_code:string;analysis_type:string;title:string;status:string;body_id:string;project_id:string|null;created_at:string};',
              'type Gender={id:string;reference_code:string;analysis_type:string;title:string;status:string;body_id:string;project_id:string|null;context?:string|null;findings?:string|null;barriers?:string|null;recommendations?:string|null;created_at:string};', 'Gender')
          rep('type CaseRow={id:string;case_number:string;case_type:string;title:string;priority:string;status:string;project_id:string;body_id:string|null;assigned_to:string|null;opened_at:string};',
              'type CaseRow={id:string;case_number:string;case_type:string;title:string;summary?:string|null;priority:string;status:string;sensitivity?:string;project_id:string;body_id:string|null;assigned_to:string|null;opened_at:string;closed_at?:string|null};', 'CaseRow')
          rep('type Beneficiary={id:string;reference_code:string;project_id:string;full_name:string;gender:string};',
              'type Beneficiary={id:string;reference_code:string;project_id:string;full_name:string;gender:string;phone?:string|null;locality?:string|null;status?:string};', 'Beneficiary')

          rep(' const [loading,setLoading]=useState(true),[busy,setBusy]=useState(false),[notice,setNotice]=useState("");',
              ' const [loading,setLoading]=useState(true),[busy,setBusy]=useState(false),[notice,setNotice]=useState(""),[loadWarning,setLoadWarning]=useState("");', 'loading states')
          rep(' const [staffing,setStaffing]=useState<Slot[]>([]),[directory,setDirectory]=useState<DirectoryPerson[]>([]),[staffSearch,setStaffSearch]=useState(""),[selectedSlot,setSelectedSlot]=useState("");',
              ' const [staffing,setStaffing]=useState<Slot[]>([]),[assignmentsCatalog,setAssignmentsCatalog]=useState<AssignmentAdmin[]>([]),[directory,setDirectory]=useState<DirectoryPerson[]>([]),[staffSearch,setStaffSearch]=useState(""),[staffStatus,setStaffStatus]=useState("all"),[directorySearch,setDirectorySearch]=useState(""),[selectedSlot,setSelectedSlot]=useState("");', 'staff states')
          rep(' const [mails,setMails]=useState<Mail[]>([]),[gender,setGender]=useState<Gender[]>([]),[cases,setCases]=useState<CaseRow[]>([]),[beneficiaries,setBeneficiaries]=useState<Beneficiary[]>([]);',
              ' const [mails,setMails]=useState<Mail[]>([]),[correspondenceDirectory,setCorrespondenceDirectory]=useState<CorrespondencePerson[]>([]),[mailSearch,setMailSearch]=useState(""),[mailStatus,setMailStatus]=useState("all"),[mailPersonSearch,setMailPersonSearch]=useState(""),[gender,setGender]=useState<Gender[]>([]),[genderSearch,setGenderSearch]=useState(""),[cases,setCases]=useState<CaseRow[]>([]),[beneficiaries,setBeneficiaries]=useState<Beneficiary[]>([]),[caseSearch,setCaseSearch]=useState(""),[teamSearch,setTeamSearch]=useState(""),[resourceSearch,setResourceSearch]=useState("");', 'domain states')

          old_refresh=''' async function refresh(){
  setLoading(true);
  const wr=await supabase.rpc("my_position_workspace");
  const sr=await supabase.rpc("my_position_operational_summary");
  if(wr.error||sr.error){setNotice(wr.error?.message||sr.error?.message||"Chargement impossible");setLoading(false);return;}
  const w=wr.data as Workspace; setWorkspace(w); setSummary(sr.data as Summary); const c=new Set(w.capabilities||[]);
  if(c.has("staffing.view")){const r=await supabase.rpc("institutional_staffing_catalog",{target_body_id:null,target_region:null,target_status:null,search_text:null,max_rows:2000});if(!r.error)setStaffing((r.data||[]) as Slot[]);}
  if(c.has("staffing.assign")){const r=await supabase.rpc("staffing_directory",{target_body_id:null});if(!r.error)setDirectory((r.data||[]) as DirectoryPerson[]);}
  if(c.has("correspondence.manage")||c.has("correspondence.orient")){const r=await supabase.from("institutional_correspondence").select("*").order("created_at",{ascending:false}).limit(250);if(!r.error)setMails((r.data||[]) as Mail[]);}
  if(c.has("gender.analysis.manage")){const r=await supabase.from("gender_analysis_records").select("id,reference_code,analysis_type,title,status,body_id,project_id,created_at").order("created_at",{ascending:false}).limit(100);if(!r.error)setGender((r.data||[]) as Gender[]);}
  if(c.has("case.assigned.manage")||c.has("case.supervise_sensitive")||c.has("protection.manage")){
   const cr=await supabase.from("case_files").select("id,case_number,case_type,title,priority,status,project_id,body_id,assigned_to,opened_at").order("opened_at",{ascending:false}).limit(100);if(!cr.error)setCases((cr.data||[]) as CaseRow[]);
   const br=await supabase.from("beneficiaries").select("id,reference_code,project_id,full_name,gender").order("created_at",{ascending:false}).limit(200);if(!br.error)setBeneficiaries((br.data||[]) as Beneficiary[]);
  }
  setLoading(false);
 }
 useEffect(()=>{void refresh();},[]);'''
          new_refresh=''' async function refresh(showSpinner=true){
  if(showSpinner)setLoading(true);setLoadWarning("");const warnings:string[]=[];
  const [wr,sr]=await Promise.all([supabase.rpc("my_position_workspace"),supabase.rpc("my_position_operational_summary")]);
  if(wr.error||sr.error){setNotice(wr.error?.message||sr.error?.message||"Chargement impossible");if(showSpinner)setLoading(false);return;}
  const w=wr.data as Workspace;setWorkspace(w);setSummary(sr.data as Summary);const c=new Set(w.capabilities||[]);
  if(c.has("staffing.view")){const [r,a]=await Promise.all([supabase.rpc("institutional_staffing_catalog",{target_body_id:null,target_region:null,target_status:null,search_text:null,max_rows:2000}),supabase.rpc("position_assignment_catalog",{target_slot_id:null,search_text:null,max_rows:2000})]);if(r.error)warnings.push(`Structure : ${r.error.message}`);else setStaffing((r.data||[]) as Slot[]);if(a.error)warnings.push(`Affectations : ${a.error.message}`);else setAssignmentsCatalog((a.data||[]) as AssignmentAdmin[]);}
  if(c.has("staffing.assign")){const r=await supabase.rpc("staffing_directory",{target_body_id:null});if(r.error)warnings.push(`Annuaire RH : ${r.error.message}`);else setDirectory((r.data||[]) as DirectoryPerson[]);}
  if(c.has("correspondence.manage")||c.has("correspondence.orient")){const [r,d]=await Promise.all([supabase.from("institutional_correspondence").select("*").order("created_at",{ascending:false}).limit(500),supabase.rpc("correspondence_directory",{target_body_id:null,search_text:null,max_rows:500})]);if(r.error)warnings.push(`Courrier : ${r.error.message}`);else setMails((r.data||[]) as Mail[]);if(d.error)warnings.push(`Annuaire courrier : ${d.error.message}`);else setCorrespondenceDirectory((d.data||[]) as CorrespondencePerson[]);}
  if(c.has("gender.analysis.manage")){const r=await supabase.from("gender_analysis_records").select("*").order("created_at",{ascending:false}).limit(300);if(r.error)warnings.push(`Genre : ${r.error.message}`);else setGender((r.data||[]) as Gender[]);}
  if(c.has("case.assigned.manage")||c.has("case.supervise_sensitive")||c.has("protection.manage")){
   const [cr,br]=await Promise.all([supabase.from("case_files").select("id,case_number,case_type,title,summary,priority,status,sensitivity,project_id,body_id,assigned_to,opened_at,closed_at").order("opened_at",{ascending:false}).limit(300),supabase.from("beneficiaries").select("id,reference_code,project_id,full_name,gender,phone,locality,status").order("created_at",{ascending:false}).limit(500)]);if(cr.error)warnings.push(`Cas : ${cr.error.message}`);else setCases((cr.data||[]) as CaseRow[]);if(br.error)warnings.push(`Bénéficiaires : ${br.error.message}`);else setBeneficiaries((br.data||[]) as Beneficiary[]);
  }
  setLoadWarning(warnings.join(" · "));if(showSpinner)setLoading(false);
 }
 useEffect(()=>{void refresh();const params=new URLSearchParams(window.location.search);const requested=params.get("section") as Section|null;if(requested&&["dashboard","missions","team","reports","meetings","resources","staffing","correspondence","gender","protection","education","meal"].includes(requested))setSection(requested);},[]);
 useEffect(()=>{let timer:ReturnType<typeof setTimeout>|null=null;const schedule=()=>{if(timer)clearTimeout(timer);timer=setTimeout(()=>void refresh(false),250);};const channel=supabase.channel(`my-position-v3:${workspace?.profile.id||"loading"}`)
  .on("postgres_changes",{event:"*",schema:"public",table:"position_assignments"},schedule)
  .on("postgres_changes",{event:"*",schema:"public",table:"position_slots"},schedule)
  .on("postgres_changes",{event:"*",schema:"public",table:"institutional_correspondence"},schedule)
  .on("postgres_changes",{event:"*",schema:"public",table:"gender_analysis_records"},schedule)
  .on("postgres_changes",{event:"*",schema:"public",table:"case_files"},schedule)
  .on("postgres_changes",{event:"*",schema:"public",table:"beneficiaries"},schedule).subscribe();return()=>{if(timer)clearTimeout(timer);void supabase.removeChannel(channel);};},[supabase,workspace?.profile.id]);'''
          rep(old_refresh,new_refresh,'refresh')

          rep(' const visibleSlots=useMemo(()=>{const q=staffSearch.trim().toLowerCase();return staffing.filter(s=>!q||`${s.slot_code} ${s.title} ${s.body_code} ${s.body_name} ${s.region||""} ${s.locality||""} ${s.project_code||""} ${s.project_name||""}`.toLowerCase().includes(q));},[staffing,staffSearch]);',
              ' const visibleSlots=useMemo(()=>{const q=staffSearch.trim().toLowerCase();return staffing.filter(s=>(staffStatus==="all"||s.slot_status===staffStatus)&&(!q||`${s.slot_code} ${s.title} ${s.body_code} ${s.body_name} ${s.region||""} ${s.locality||""} ${s.project_code||""} ${s.project_name||""}`.toLowerCase().includes(q)));},[staffing,staffSearch,staffStatus]);\n const filteredDirectory=useMemo(()=>{const q=directorySearch.trim().toLowerCase();return directory.filter(p=>!q||`${p.full_name||""} ${p.email||""} ${p.phone||""} ${(p.active_positions||[]).join(" ")}`.toLowerCase().includes(q)).slice(0,100);},[directory,directorySearch]);\n const filteredMailPeople=useMemo(()=>{const q=mailPersonSearch.trim().toLowerCase();return correspondenceDirectory.filter(p=>!q||`${p.full_name||""} ${p.email||""} ${p.phone||""} ${(p.position_titles||[]).join(" ")}`.toLowerCase().includes(q)).slice(0,100);},[correspondenceDirectory,mailPersonSearch]);\n const visibleMails=useMemo(()=>{const q=mailSearch.trim().toLowerCase();return mails.filter(m=>(mailStatus==="all"||m.status===mailStatus)&&(!q||`${m.correspondence_number} ${m.subject} ${m.sender_name||""} ${m.sender_organization||""} ${m.recipient_name||""} ${m.recipient_organization||""} ${m.status} ${m.priority}`.toLowerCase().includes(q)));},[mails,mailSearch,mailStatus]);\n const visibleGender=useMemo(()=>{const q=genderSearch.trim().toLowerCase();return gender.filter(g=>!q||`${g.reference_code} ${g.title} ${g.analysis_type} ${g.status}`.toLowerCase().includes(q));},[gender,genderSearch]);\n const visibleCases=useMemo(()=>{const q=caseSearch.trim().toLowerCase();return cases.filter(c=>!q||`${c.case_number} ${c.title} ${c.case_type} ${c.priority} ${c.status}`.toLowerCase().includes(q));},[cases,caseSearch]);\n const visibleResources=useMemo(()=>{const q=resourceSearch.trim().toLowerCase();return (workspace?.resources||[]).filter(r=>!q||`${r.resource_code} ${r.title} ${r.category} ${r.classification} ${r.source_reference||""}`.toLowerCase().includes(q));},[workspace,resourceSearch]);\n const teamSupervisors=useMemo(()=>{const q=teamSearch.trim().toLowerCase();return (workspace?.supervisors||[]).filter(p=>!q||`${p.name} ${p.title} ${p.email||""} ${p.phone||""} ${p.relation_type||""}`.toLowerCase().includes(q));},[workspace,teamSearch]);\n const teamSubordinates=useMemo(()=>{const q=teamSearch.trim().toLowerCase();return (workspace?.subordinates||[]).filter(p=>!q||`${p.name} ${p.title} ${p.email||""} ${p.phone||""} ${p.relation_type||""}`.toLowerCase().includes(q));},[workspace,teamSearch]);', 'filters')

          rep(' async function action<T>(fn:()=>Promise<T>,success:string){setBusy(true);setNotice("");try{await fn();setNotice(success);await refresh();}catch(e){setNotice(e instanceof Error?e.message:"Action impossible");}finally{setBusy(false);}}',
              ' async function action<T>(fn:()=>Promise<T>,success:string|((value:T)=>string)){setBusy(true);setNotice("");try{const value=await fn();setNotice(typeof success==="function"?success(value):success);await refresh(false);}catch(e){setNotice(e instanceof Error?e.message:"Action impossible");}finally{setBusy(false);}}', 'action helper')

          rep('  {notice&&<div className="pwNotice">{notice}<button onClick={()=>setNotice("")}>×</button></div>}',
              '  {notice&&<div className="pwNotice" role="status">{notice}<button aria-label="Fermer" onClick={()=>setNotice("")}>×</button></div>}\n  {loadWarning&&<div className="pwWarning" role="alert"><b>Chargement partiel :</b> {loadWarning}</div>}', 'notices')

          rep('{section==="team"&&<div className="pwGrid"><People title="Mes responsables" rows={workspace.supervisors}/><People title="Mes collaborateurs / subordonnés" rows={workspace.subordinates}/></div>}',
              '{section==="team"&&<><section className="portalPanel pwToolbar"><div><h2>Équipe & hiérarchie</h2><p>La relation hiérarchique et la relation technique sont distinguées.</p></div><input value={teamSearch} onChange={e=>setTeamSearch(e.target.value)} placeholder="Rechercher nom, poste, e-mail, relation…"/></section><div className="pwGrid"><People title="Mes responsables" rows={teamSupervisors}/><People title="Mes collaborateurs / subordonnés" rows={teamSubordinates}/></div></>}', 'team UI')

          rep('{section==="resources"&&<div className="pwGrid">{workspace.resources.length?workspace.resources.map(r=><Card key={r.resource_code} title={r.title}>',
              '{section==="resources"&&<><section className="portalPanel pwToolbar"><div><h2>Documents ressources</h2><p>Ressources rattachées aux fonctions actives de votre poste.</p></div><input value={resourceSearch} onChange={e=>setResourceSearch(e.target.value)} placeholder="Rechercher titre, catégorie, référence…"/></section><div className="pwGrid">{visibleResources.length?visibleResources.map(r=><Card key={r.resource_code} title={r.title}>', 'resources start')
          rep('</Card>):<Card title="Documents ressources"><p>Aucune ressource spécifique liée au poste.</p></Card>}</div>}',
              '</Card>):<Card title="Documents ressources"><p>Aucune ressource correspondant à la recherche.</p></Card>}</div></>}', 'resources end')

          rep('function People({title,rows}:{title:string;rows:Person[]}){return <Card title={title}>{rows.length?rows.map(p=><p key={p.assignment_id}><b>{p.name}</b><br/>{p.title}<br/><small>{p.email||""} {p.phone||""}</small></p>):<p>Aucun titulaire enregistré.</p>}</Card>}',
              'function People({title,rows}:{title:string;rows:Person[]}){return <Card title={title}>{rows.length?rows.map((p,i)=><div className="pwPerson" key={`${p.assignment_id}-${p.relation_type||i}`}><div><b>{p.name}</b><br/>{p.title}{p.relation_type&&<><br/><span className="pwTag">Relation {p.relation_type}</span></>}<br/><small>{p.email||""} {p.phone||""}</small></div><div className="pwButtons">{p.email&&<a href={`mailto:${p.email}`}>E-mail</a>}{p.phone&&<a className="muted" href={`tel:${p.phone}`}>Appeler</a>}<Link className="muted" href="/espace?tab=messages">Messagerie</Link></div></div>):<p>Aucun titulaire enregistré.</p>}</Card>}', 'People')

          rep('.pwNotice{background:#fff7d8;border:1px solid #dfc56f;padding:10px;border-radius:8px;margin:10px 0;display:flex;justify-content:space-between}.pwNotice button{border:0;background:transparent;font-size:20px}',
              '.pwNotice{background:#fff7d8;border:1px solid #dfc56f;padding:10px;border-radius:8px;margin:10px 0;display:flex;justify-content:space-between;color:#3f3416}.pwNotice button{border:0;background:transparent;font-size:20px;color:#3f3416}.pwWarning{background:#fff4e5;border:1px solid #e3a94b;color:#6b3c09;padding:10px;border-radius:8px;margin:10px 0}.pwToolbar{display:flex;gap:12px;justify-content:space-between;align-items:end;flex-wrap:wrap}.pwToolbar input,.pwToolbar select{min-width:min(360px,100%);padding:9px;border:1px solid #aebdb5;border-radius:7px;background:#fff;color:#17251e}.pwPerson{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #e5ece8;padding:10px 0}.pwPerson:last-child{border-bottom:0}.pwButtons button:disabled,.pwForm button:disabled,table button:disabled{opacity:.5;cursor:not-allowed}', 'styles')
          rep('.pwForm input,.pwForm select,.pwForm textarea,.pwHeader input,.pwSensitive select{width:100%;padding:9px;border:1px solid #b8c6be;border-radius:7px;background:#fff}',
              '.pwForm input,.pwForm select,.pwForm textarea,.pwHeader input,.pwSensitive select{width:100%;padding:9px;border:1px solid #b8c6be;border-radius:7px;background:#fff;color:#15231c}.pwForm input:focus,.pwForm select:focus,.pwForm textarea:focus,.pwHeader input:focus,.pwToolbar input:focus,.pwToolbar select:focus{outline:3px solid #c9e3d5;border-color:#326e51}', 'input styles')

          p.write_text(s)
          PY
