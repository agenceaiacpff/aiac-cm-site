name: Patch messaging shell final

on:
  push:
    paths:
      - '.github/workflows/patch-messaging-shell-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portal shell and messaging copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/PortalClientV2.tsx')
          s=p.read_text()
          old='''          setNotifications((items) => [incoming, ...items.filter((item) => item.id !== incoming.id)]);\n          setNotice(`Nouvelle notification : ${incoming.title}`);'''
          new='''          setNotifications((items) => [incoming, ...items.filter((item) => item.id !== incoming.id)]);\n          setNotice(`Nouvelle notification : ${incoming.title}`);\n          if (["message", "message_access", "message_admin"].includes(incoming.category || "")) {\n            void refreshUnreadMessageCounts();\n          }'''
          if old not in s:
              raise SystemExit('notification anchor not found')
          s=s.replace(old,new,1)
          old2='.on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, () => {\n        void refreshUnreadMessageCounts();\n      })'
          new2='.on("postgres_changes", { event: "*", schema: "public", table: "messages" }, () => {\n        void refreshUnreadMessageCounts();\n      })\n      .on("postgres_changes", { event: "*", schema: "public", table: "message_reads", filter: `user_id=eq.${profile.id}` }, () => {\n        void refreshUnreadMessageCounts();\n      })'
          if old2 not in s:
              raise SystemExit('messages realtime anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('components/MessageCenterV2.tsx')
          s=p.read_text()
          old='Le destinataire et vous devenez responsables de la conversation. Il reçoit une notification dès la création.'
          new='Vous restez responsable de la conversation. Le destinataire est ajouté comme participant et reçoit une notification ; vous pouvez ensuite le promouvoir responsable si nécessaire.'
          if old not in s:
              raise SystemExit('message creation copy anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/patch-messaging-shell-final.yml
          git config user.name "agenceaiacpff"
          git config user.email "84762273+agenceaiacpff@users.noreply.github.com"
          git add components/PortalClientV2.tsx components/MessageCenterV2.tsx
          git commit -m "Finalize messaging badges and conversation role UX"
          git push
