name: Patch My Position integration
on:
  push:
    paths:
      - '.github/workflows/patch-my-position-integration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portal and account assignment path
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('components/PortalClientV2.tsx')
          s=p.read_text()
          old='''function routeFor(tab: string) {\n  if (tab === "terrain") return "/espace/terrain";\n  if (tab === "accueil") return "/espace";'''
          new='''function routeFor(tab: string) {\n  if (tab === "terrain") return "/espace/terrain";\n  if (tab === "poste") return "/espace/poste";\n  if (tab === "accueil") return "/espace";'''
          if old not in s: raise SystemExit('routeFor anchor missing')
          s=s.replace(old,new,1)
          old='''  const isSuperAdmin = profile.role === "super_admin";\n'''
          new='''  const isSuperAdmin = profile.role === "super_admin";\n  const hasActivePosition = initialPositionAssignments.some((item) => item.profile_id === profile.id && item.status === "active");\n'''
          if old not in s: raise SystemExit('role anchor missing')
          s=s.replace(old,new,1)
          old='''  const navItems: Array<[string, string]> = [\n    ["accueil", "Tableau de bord"],\n    ["reunions", "Réunions et agenda"],'''
          new='''  const navItems: Array<[string, string]> = [\n    ["accueil", "Tableau de bord"],\n    ...((hasActivePosition || isSuperAdmin) ? [["poste", "Mon poste"] as [string, string]] : []),\n    ["reunions", "Réunions et agenda"],'''
          if old not in s: raise SystemExit('nav anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('components/AccountsPanelHeavy.tsx')
          s=p.read_text()
          old='''    const payload={position_id:String(data.get("position_id")),body_id:String(data.get("body_id")),profile_id:account.id,territory:String(data.get("territory")||"").trim()||null,decision_reference:String(data.get("decision_reference")||"").trim(),start_date:data.get("start_date"),appointed_by:currentProfile.id};\n    const {data:created,error}=await supabase.from("position_assignments").insert(payload).select().single();\n    if(error||!created)setNotice(error?.message||"Affectation impossible");else{setAssignments(rows=>[created as PositionAssignmentRow,...rows]);form.reset();setNotice("Poste rattaché à l’organe, au territoire et à la décision de nomination.");}setBusy(false);'''
          new='''    const {data:created,error}=await supabase.rpc("assign_profile_to_position_definition",{target_position_id:String(data.get("position_id")),target_body_id:String(data.get("body_id")),target_profile_id:account.id,target_decision_reference:String(data.get("decision_reference")||"").trim(),target_start_date:String(data.get("start_date")||"")||null});\n    if(error||!created)setNotice(error?.message||"Affectation impossible");else{form.reset();setNotice("Affectation enregistrée via le moteur institutionnel. Le poste, la hiérarchie, les droits et la notification sont synchronisés.");}setBusy(false);'''
          if old not in s: raise SystemExit('Accounts assignment anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git rm .github/workflows/patch-my-position-integration.yml
          git config user.name "agenceaiacpff"
          git config user.email "84762273+agenceaiacpff@users.noreply.github.com"
          git add components/PortalClientV2.tsx components/AccountsPanelHeavy.tsx
          git commit -m "Integrate My Position and controlled position assignment"
          git push
