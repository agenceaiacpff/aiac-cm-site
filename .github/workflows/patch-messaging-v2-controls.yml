name: Patch messaging V2 controls

on:
  push:
    paths:
      - 'scripts/patch-message-center-v2.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply targeted patch
        run: node scripts/patch-message-center-v2.mjs
      - name: Commit targeted patch
        run: |
          if git diff --quiet -- components/MessageCenterV2.tsx; then
            echo "No change required"
            exit 0
          fi
          git config user.name "agenceaiacpff"
          git config user.email "84762273+agenceaiacpff@users.noreply.github.com"
          git add components/MessageCenterV2.tsx
          git commit -m "Add unread and leave controls to messaging V2"
          git push
