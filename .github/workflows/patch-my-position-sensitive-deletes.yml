name: Patch My Position sensitive deletes
'on':
  push:
    paths:
      - '.github/workflows/patch-my-position-sensitive-deletes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V3 delete calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/MyPositionWorkspaceV3.tsx')
          s=p.read_text()
          replacements={
'''const audit=await supabase.from("audit_logs").insert({actor_id:workspace?.profile.id,action:"gender_analysis.deleted",entity_type:"gender_analysis",entity_id:g.id,details:{reason,reference:g.reference_code}});err(audit.error);const r=await supabase.from("gender_analysis_records").delete().eq("id",g.id);err(r.error);return true;''':'''const r=await supabase.rpc("delete_gender_analysis_admin",{target_id:g.id,target_reason:reason});err(r.error);return true;''',
'''const audit=await supabase.from("audit_logs").insert({actor_id:workspace?.profile.id,action:"beneficiary.deleted",entity_type:"beneficiary",entity_id:b.id,details:{reason,reference:b.reference_code}});err(audit.error);const r=await supabase.from("beneficiaries").delete().eq("id",b.id);err(r.error);return true;''':'''const r=await supabase.rpc("delete_beneficiary_admin",{target_id:b.id,target_reason:reason});err(r.error);return true;''',
'''const audit=await supabase.from("audit_logs").insert({actor_id:workspace?.profile.id,action:"case.deleted_by_superadmin",entity_type:"case_file",entity_id:c.id,details:{reason,case_number:c.case_number}});err(audit.error);const r=await supabase.from("case_files").delete().eq("id",c.id);err(r.error);return true;''':'''const r=await supabase.rpc("delete_case_admin",{target_id:c.id,target_reason:reason});err(r.error);return true;'''
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('sensitive deletion anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git rm .github/workflows/patch-my-position-sensitive-deletes.yml
          git config user.name "agenceaiacpff"
          git config user.email "84762273+agenceaiacpff@users.noreply.github.com"
          git add components/MyPositionWorkspaceV3.tsx
          git commit -m "Use controlled server-side sensitive deletions"
          git push
